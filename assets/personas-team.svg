  <g transform="translate(724, 200)">
    <rect width="208" height="270" rx="4" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="208" height="6" fill="#00A4EF"/>
