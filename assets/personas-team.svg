<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="520" fill="#F7F7F5"/>

  <text x="60" y="58" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="1.4">EQUIPO · 5 PERSONAS · 10 ROLES · 5 PAREJAS</text>
  <text x="60" y="108" fill="#1A1A1A" font-size="42" font-weight="500">Dos roles por persona</text>
  <text x="60" y="146" fill="#737373" font-size="20">Cada persona cubre una pareja completa del SDLC, sin transición interna entre sus roles.</text>

  <g transform="translate(40, 200)">
    <rect width="208" height="270" rx="4" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="208" height="6" fill="#F25022"/>
    <text x="18" y="44" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.1">PAREJA 1 · VISIÓN</text>
    <text x="18" y="82" fill="#1A1A1A" font-size="25" font-weight="500">Visión</text>
    <text x="18" y="112" fill="#737373" font-size="14">Identifica valor y alcance.</text>
    <g transform="translate(18, 150)">
      <circle cx="8" cy="8" r="6" fill="#F25022"/>
      <text x="24" y="13" fill="#1A1A1A" font-size="15">Responsable de producto</text>
    </g>
    <g transform="translate(18, 184)">
      <circle cx="8" cy="8" r="6" fill="#F25022"/>
      <text x="24" y="13" fill="#1A1A1A" font-size="15">Ingeniería de requisitos</text>
    </g>
  </g>

  <g transform="translate(268, 200)">
