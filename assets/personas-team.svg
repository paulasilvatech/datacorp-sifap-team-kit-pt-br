    <rect x="0" y="0" width="208" height="6" fill="#1B1B1F"/>
    <text x="18" y="44" fill="#555555" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.1">PAREJA 5 · OPERACIONES</text>
