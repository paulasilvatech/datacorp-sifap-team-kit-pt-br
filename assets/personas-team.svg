    <rect x="0" y="0" width="208" height="6" fill="#FFB900"/>
    <text x="18" y="44" fill="#B88500" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.1">PAREJA 2 · ARQUITECTURA</text>
    <text x="18" y="82" fill="#1A1A1A" font-size="25" font-weight="500">Arquitectura</text>
    <text x="18" y="112" fill="#737373" font-size="13">Diseña límites y decisiones.</text>
    <g transform="translate(18, 150)">
      <circle cx="8" cy="8" r="6" fill="#FFB900"/>
      <text x="24" y="13" fill="#1A1A1A" font-size="15">Arquitecto empresarial</text>
    </g>
    <g transform="translate(18, 184)">
      <circle cx="8" cy="8" r="6" fill="#FFB900"/>
      <text x="24" y="13" fill="#1A1A1A" font-size="15">Arquitecto de software</text>
    </g>
  </g>

  <g transform="translate(496, 200)">
    <rect width="208" height="270" rx="4" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="208" height="6" fill="#7FBA00"/>
    <text x="18" y="44" fill="#5A8500" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.1">PAREJA 3 · ENTREGA</text>
    <text x="18" y="82" fill="#1A1A1A" font-size="25" font-weight="500">Entrega</text>
    <text x="18" y="112" fill="#737373" font-size="13">Coordina y entrega código.</text>
    <g transform="translate(18, 150)">
      <circle cx="8" cy="8" r="6" fill="#7FBA00"/>
