    <text x="20" y="32" fill="#0076AC" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" letter-spacing="1.2">ETAPA 02</text>
    <text x="20" y="56" fill="#1A1A1A" font-size="18" font-weight="500">Especificación moderna</text>
