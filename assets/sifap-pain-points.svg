<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="500" fill="#F7F7F5"/>

  <text x="60" y="60" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="1.9">LEGADO · SIFAP 1.0 · 1997</text>
  <text x="60" y="110" fill="#1A1A1A" font-size="42" font-weight="500" letter-spacing="-0.8">Por qué SIFAP debe cambiar</text>
  <text x="60" y="148" fill="#737373" font-size="20">Cuatro problemas tras 29 años en producción</text>

  <g transform="translate(60, 200)">
    <rect width="260" height="240" fill="#FFFFFF" stroke="#CECEC7" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="6" fill="#F25022"/>
    <text x="24" y="50" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">DEUDA TÉCNICA</text>
    <text x="24" y="120" fill="#F25022" font-size="72" font-weight="300" letter-spacing="-2">287K</text>
    <text x="24" y="155" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.2">LÍNEAS DE NATURAL</text>
    <text x="24" y="195" fill="#3A3A3A" font-size="14">Reglas de negocio ocultas en</text>
    <text x="24" y="216" fill="#3A3A3A" font-size="14">rutinas sin documentar.</text>
  </g>

  <g transform="translate(340, 200)">
    <rect width="260" height="240" fill="#FFFFFF" stroke="#CECEC7" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="6" fill="#F25022"/>
    <text x="24" y="50" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">PÉRDIDA DE CONOCIMIENTO</text>
    <text x="24" y="120" fill="#F25022" font-size="72" font-weight="300" letter-spacing="-2">0</text>
    <text x="24" y="155" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.2">AUTORES ORIGINALES</text>
    <text x="24" y="195" fill="#3A3A3A" font-size="14">El equipo que creó el sistema</text>
    <text x="24" y="216" fill="#3A3A3A" font-size="14">se ha jubilado.</text>
  </g>

  <g transform="translate(620, 200)">
    <rect width="260" height="240" fill="#FFFFFF" stroke="#CECEC7" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="6" fill="#F25022"/>
    <text x="24" y="50" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">COBERTURA DE PRUEBAS</text>
    <text x="24" y="120" fill="#F25022" font-size="72" font-weight="300" letter-spacing="-2">&lt;5%</text>
    <text x="24" y="155" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.2">PRUEBAS AUTOMATIZADAS</text>
    <text x="24" y="195" fill="#3A3A3A" font-size="15">Cada cambio es una apuesta.</text>
    <text x="24" y="216" fill="#3A3A3A" font-size="15">Las regresiones aparecen</text>
    <text x="24" y="237" fill="#3A3A3A" font-size="15">en producción.</text>
  </g>

  <g transform="translate(900, 200)">
    <rect width="240" height="240" fill="#FFFFFF" stroke="#CECEC7" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="6" fill="#F25022"/>
    <text x="24" y="50" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">VELOCIDAD</text>
    <text x="24" y="120" fill="#F25022" font-size="72" font-weight="300" letter-spacing="-2">6 sem</text>
    <text x="24" y="155" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.2">POR FUNCIONALIDAD PEQUEÑA</text>
    <text x="24" y="195" fill="#3A3A3A" font-size="14">Los cambios de negocio esperan</text>
    <text x="24" y="216" fill="#3A3A3A" font-size="14">semanas para entregarse.</text>
  </g>
</svg>
